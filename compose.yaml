services:
  solr:
    image: solr:9.8
    command:
      - bash
      - -ec
      - |
        configset=/var/solr/data/configsets/semantic-arena
        if [ ! -f "$$configset/conf/solrconfig.xml" ]; then
          mkdir -p /var/solr/data/configsets
          cp -a /opt/solr/server/solr/configsets/_default "$$configset"
        fi
        exec solr -f
    ports:
      - "127.0.0.1:8983:8983"
    volumes:
      - solr-data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8983/solr/admin/info/system?wt=json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  meilisearch:
    image: getmeili/meilisearch:v1.16.0
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${SEMANTIC_ARENA_MEILISEARCH_MASTER_KEY:-change-this-development-key}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  solr-data:
  meilisearch-data:
